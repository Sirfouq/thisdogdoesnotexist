data:
  root: data/afhq
  image_size: &image_size 64
vae:
  latent_dim: 128
  channels: 3

ddpm:
  timesteps: 1000
  schedule: cosine

unet:
  in_channels: 3
  base_channel: 64
  time_emb_dim: 64
  channels_mults: [1, 2, 2, 4]
  num_res_blocks: 2
  num_groups: 32
  attention_res: [16, 8]
  image_size: *image_size

train:
  lr: 2.0e-4
  optimizer: adam
  batch_size: 128
  epochs: 100
  seed: 4
  # epochs, batch_size, seed, checkpoint dir

eval:
  fid_samples: 10000
