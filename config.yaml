data:
  root: data/afhq
  image_size: 64
vae:
  latent_dim: 128
  channels: 3

ddpm:
  timesteps: 1000
  schedule: cosine

unet:
  base_channels: 64
  channel_mults: [1, 2, 2, 4]
  # attention resolutions: [16, 8]

train:
  lr: 2.0e-4
  optimizer: adam
  batch_size: 128
  epochs: 500
  seed: 4
  # epochs, batch_size, seed, checkpoint dir

eval:
  fid_samples: 10000
